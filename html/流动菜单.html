  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }

    /* Godot UI FlowingMenu Simulation CSS */
    .godot-menu-wrap {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    .godot-menu {
      display: flex;
      flex-direction: column;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    .godot-menu__item {
      flex: 1;
      position: relative;
      overflow: hidden;
      text-align: center;
      border-top: 1px solid;
    }

    .godot-menu__item:first-child {
      border-top: none;
    }

    .godot-menu__item-link {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      position: relative;
      cursor: pointer;
      text-transform: uppercase;
      text-decoration: none;
      white-space: nowrap;
      font-weight: 700;
      font-size: clamp(1.8rem, 4.5vh, 3.8rem);
      letter-spacing: -0.02em;
      transition: opacity 0.2s ease;
      user-select: none;
    }

    .godot-marquee {
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transform: translate3d(0, 101%, 0);
    }

    .godot-marquee__inner-wrap {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    .godot-marquee__inner {
      display: flex;
      align-items: center;
      position: relative;
      height: 100%;
      width: fit-content;
      will-change: transform;
    }

    .godot-marquee__part {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .godot-marquee span {
      white-space: nowrap;
      text-transform: uppercase;
      font-weight: 700;
      font-size: clamp(1.8rem, 4.5vh, 3.8rem);
      line-height: 1;
      padding: 0 1.5vw;
      letter-spacing: -0.02em;
    }

    .godot-marquee__img {
      width: clamp(120px, 18vw, 220px);
      height: clamp(45px, 7vh, 70px);
      margin: 0 2vw;
      border-radius: 9999px;
      background-size: cover;
      background-position: 50% 50%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      flex-shrink: 0;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #141d26;
    }
    ::-webkit-scrollbar-thumb {
      background: #355570;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #478cbf;
    }
  </style>
</head>

          { text: 'Monterey Bay', link: 'res://maps/monterey.tscn', image: 'https://images.unsplash.com/photo-1776394254711-4a0d7345269a?q=80&w=800&h=500&fit=crop&sat=-100&auto=format' },

    function MenuItemSim({ text, image, link, speed, textColor, marqueeBgColor, marqueeTextColor, borderColor, onItemClick }) {
      const itemRef = useRef(null);
      const marqueeRef = useRef(null);
      const marqueeInnerRef = useRef(null);
      const animationRef = useRef(null);
      const [repetitions, setRepetitions] = useState(4);

      const animationDefaults = { duration: 0.6, ease: 'expo' };

      const findClosestEdge = (mouseX, mouseY, width, height) => {
        const topEdgeDist = Math.pow(mouseX - width / 2, 2) + Math.pow(mouseY - 0, 2);
        const bottomEdgeDist = Math.pow(mouseX - width / 2, 2) + Math.pow(mouseY - height, 2);
        return topEdgeDist < bottomEdgeDist ? 'top' : 'bottom';
      };

      useEffect(() => {
        const calculateRepetitions = () => {
          if (!marqueeInnerRef.current) return;
          const marqueeContent = marqueeInnerRef.current.querySelector('.godot-marquee__part');
          if (!marqueeContent) return;

          const contentWidth = marqueeContent.offsetWidth;
          const viewportWidth = window.innerWidth;
          const needed = Math.ceil(viewportWidth / contentWidth) + 2;
          setRepetitions(Math.max(4, needed));
        };

        calculateRepetitions();
        window.addEventListener('resize', calculateRepetitions);
        return () => window.removeEventListener('resize', calculateRepetitions);
      }, [text, image]);

      useEffect(() => {
        const setupMarquee = () => {
          if (!marqueeInnerRef.current) return;
          const marqueeContent = marqueeInnerRef.current.querySelector('.godot-marquee__part');
          if (!marqueeContent) return;

          const contentWidth = marqueeContent.offsetWidth;
          if (contentWidth === 0) return;

          if (animationRef.current) {
            animationRef.current.kill();
          }

          animationRef.current = gsap.to(marqueeInnerRef.current, {
            x: -contentWidth,
            duration: speed,
            ease: 'none',
            repeat: -1
          });
        };

        const timer = setTimeout(setupMarquee, 50);

        return () => {
          clearTimeout(timer);
          if (animationRef.current) animationRef.current.kill();
        };
      }, [text, image, repetitions, speed]);

      const handleMouseEnter = ev => {
        if (!itemRef.current || !marqueeRef.current || !marqueeInnerRef.current) return;
        const rect = itemRef.current.getBoundingClientRect();
        const x = ev.clientX - rect.left;
        const y = ev.clientY - rect.top;
        const edge = findClosestEdge(x, y, rect.width, rect.height);

        gsap
          .timeline({ defaults: animationDefaults })
          .set(marqueeRef.current, { y: edge === 'top' ? '-101%' : '101%' }, 0)
          .set(marqueeInnerRef.current, { y: edge === 'top' ? '101%' : '-101%' }, 0)
          .to([marqueeRef.current, marqueeInnerRef.current], { y: '0%' }, 0);
      };

      const handleMouseLeave = ev => {
        if (!itemRef.current || !marqueeRef.current || !marqueeInnerRef.current) return;
        const rect = itemRef.current.getBoundingClientRect();
        const x = ev.clientX - rect.left;
        const y = ev.clientY - rect.top;
        const edge = findClosestEdge(x, y, rect.width, rect.height);

        gsap
          .timeline({ defaults: animationDefaults })
          .to(marqueeRef.current, { y: edge === 'top' ? '-101%' : '101%' }, 0)
          .to(marqueeInnerRef.current, { y: edge === 'top' ? '101%' : '-101%' }, 0);
      };

      return (
        <div className="godot-menu__item" ref={itemRef} style={{ borderColor }}>
          <div
            className="godot-menu__item-link"
            onClick={() => onItemClick && onItemClick({ text, link, image })}
            onMouseEnter={handleMouseEnter}
            onMouseLeave={handleMouseLeave}
            style={{ color: textColor }}
          >
            {text}
          </div>
          <div className="godot-marquee" ref={marqueeRef} style={{ backgroundColor: marqueeBgColor }}>
            <div className="godot-marquee__inner-wrap">
              <div className="godot-marquee__inner" ref={marqueeInnerRef} aria-hidden="true">
                {[...Array(repetitions)].map((_, idx) => (
                  <div className="godot-marquee__part" key={idx} style={{ color: marqueeTextColor }}>
                    <span>{text}</span>
                    <div className="godot-marquee__img" style={{ backgroundImage: `url(${image})` }} />
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function FlowingMenuSim({ items, speed, textColor, bgColor, marqueeBgColor, marqueeTextColor, borderColor, onItemClick }) {
      return (
        <div className="godot-menu-wrap" style={{ backgroundColor: bgColor }}>
          <div className="godot-menu">
            {items.map((item, idx) => (
              <MenuItemSim
                key={idx}
                {...item}
                speed={speed}
                textColor={textColor}
                marqueeBgColor={marqueeBgColor}
                marqueeTextColor={marqueeTextColor}
                borderColor={borderColor}
                onItemClick={onItemClick}
              />
            ))}
          </div>
        </div>
      );
    }

    function App() {
      const [preset, setPreset] = useState(GODOT_PRESETS[0]);
      const [speed, setSpeed] = useState(GODOT_PRESETS[0].speed);
      const [textColor, setTextColor] = useState(GODOT_PRESETS[0].textColor);
      const [bgColor, setBgColor] = useState(GODOT_PRESETS[0].bgColor);
      const [marqueeBgColor, setMarqueeBgColor] = useState(GODOT_PRESETS[0].marqueeBgColor);
      const [marqueeTextColor, setMarqueeTextColor] = useState(GODOT_PRESETS[0].marqueeTextColor);
      const [borderColor, setBorderColor] = useState(GODOT_PRESETS[0].borderColor);
      const [items, setItems] = useState(GODOT_PRESETS[0].items);

      const [activeTab, setActiveTab] = useState('simulation'); // 'simulation', 'menu_gd', 'item_gd', 'tscn_guide'
      const [selectedItem, setSelectedItem] = useState(null);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const showNotification = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      const copyToClipboard = (text, title) => {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showNotification(`Copied ${title} to clipboard!`);
        } catch (e) {
          showNotification('Failed to copy text.');
        }
      };

      const handlePreset = (p) => {
        setPreset(p);
        setSpeed(p.speed);
        setTextColor(p.textColor);
        setBgColor(p.bgColor);
        setMarqueeBgColor(p.marqueeBgColor);
        setMarqueeTextColor(p.marqueeTextColor);
        setBorderColor(p.borderColor);
        setItems(p.items);
        showNotification(`Applied ${p.name} preset`);
      };

      const flowingMenuGDScript = useMemo(() => {
        return `# ==========================================
# FlowingMenu.gd (Godot 4.x - GDScript 2.0)
# Attach this script to a Control node or CanvasLayer
# ==========================================
class_name FlowingMenu
extends Control

## Custom signal emitted when a menu item is clicked
signal item_clicked(item_data: Dictionary)

@export_category("Flowing Menu Options")
@export var items: Array[Dictionary] = [
${items.map(i => `\t{\n\t\t"text": "${i.text}",\n\t\t"link": "${i.link}",\n\t\t"image": "${i.image}"\n\t}`).join(',\n')}
]

@export var speed: float = ${speed}.0
@export var text_color: Color = Color("${textColor}")
@export var bg_color: Color = Color("${bgColor}")
@export var marquee_bg_color: Color = Color("${marqueeBgColor}")
@export var marquee_text_color: Color = Color("${marqueeTextColor}")
@export var border_color: Color = Color("${borderColor}")

@onready var menu_container: VBoxContainer = $MenuContainer

func _ready() -> void:
\tanchor_right = 1.0
\tanchor_bottom = 1.0
\t_build_menu()

func _build_menu() -> void:
\t# Clear existing children
\tfor child in menu_container.get_children():
\t\tchild.queue_free()

\tfor idx in range(items.size()):
\t\tvar item_data: Dictionary = items[idx]
\t\tvar item_node: MenuItemNode = MenuItemNode.new()
\t\t
\t\t# Configure properties
\t\titem_node.size_flags_vertical = Control.SIZE_EXPAND_FILL
\t\titem_node.item_text = item_data.get("text", "MENU ITEM")
\t\titem_node.item_link = item_data.get("link", "")
\t\titem_node.item_image_path = item_data.get("image", "")
\t\titem_node.speed = speed
\t\titem_node.text_color = text_color
\t\titem_node.marquee_bg_color = marquee_bg_color
\t\titem_node.marquee_text_color = marquee_text_color
\t\titem_node.border_color = border_color
\t\titem_node.show_top_border = (idx > 0)
\t\t
\t\titem_node.item_selected.connect(_on_item_selected)
\t\tmenu_container.add_child(item_node)

func _on_item_selected(text: String, link: String) -> void:
\tprint("[FlowingMenu] Item Clicked: ", text, " -> ", link)
\temit_signal("item_clicked", {"text": text, "link": link})
\tif link.begins_with("res://"):
\t\tget_tree().change_scene_to_file(link)
`;
      }, [items, speed, textColor, bgColor, marqueeBgColor, marqueeTextColor, borderColor]);

      const menuItemGDScript = useMemo(() => {
        return `# ==========================================
# MenuItemNode.gd (Godot 4.x - GDScript 2.0)
# Edge-detection hover marquee item implementation
# ==========================================
class_name MenuItemNode
extends Control

signal item_selected(text: String, link: String)

var item_text: String = ""
var item_link: String = ""
var item_image_path: String = ""
var speed: float = 15.0
var text_color: Color = Color.WHITE
var marquee_bg_color: Color = Color.WHITE
var marquee_text_color: Color = Color.BLACK
var border_color: Color = Color.WHITE
var show_top_border: bool = true

var _label: Label
var _marquee_overlay: PanelContainer
var _marquee_inner: HBoxContainer
var _tween: Tween
var _scroll_tween: Tween

func _ready() -> void:
\tclip_contents = true
\tmouse_entered.connect(_on_mouse_entered)
\tmouse_exited.connect(_on_mouse_exited)
\tgui_input.connect(_on_gui_input)
\t_setup_nodes()

func _setup_nodes() -> void:
\t# 1. Base Static Label
\t_label = Label.new()
\t_label.text = item_text.to_upper()
\t_label.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
\t_label.vertical_alignment = VERTICAL_ALIGNMENT_CENTER
\t_label.set_anchors_and_offsets_preset(PRESET_FULL_RECT)
\t_label.add_theme_color_override("font_color", text_color)
\t_label.add_theme_font_size_override("font_size", 42)
\tadd_child(_label)

\t# 2. Marquee Hidden Overlay Container
\t_marquee_overlay = PanelContainer.new()
\t_marquee_overlay.set_anchors_and_offsets_preset(PRESET_FULL_RECT)
\t_marquee_overlay.position.y = size.y * 1.05 # Hidden off-screen
\t_marquee_overlay.clip_contents = true
\t
\tvar stylebox := StyleBoxFlat.new()
\tstylebox.bg_color = marquee_bg_color
\t_marquee_overlay.add_theme_stylebox_override("panel", stylebox)
\tadd_child(_marquee_overlay)

\t# 3. Endless Scroll HBox
\t_marquee_inner = HBoxContainer.new()
\t_marquee_overlay.add_child(_marquee_inner)
\t_populate_marquee_parts()
\t_start_infinite_scroll()

func _populate_marquee_parts() -> void:
\tfor i in range(6): # Repeat content for seamless infinite marquee loop
\t\tvar part := HBoxContainer.new()
\t\t
\t\tvar lbl := Label.new()
\t\tlbl.text = item_text.to_upper() + "   "
\t\tlbl.add_theme_color_override("font_color", marquee_text_color)
\t\tlbl.add_theme_font_size_override("font_size", 42)
\t\tpart.add_child(lbl)
\t\t
\t\tvar img := TextureRect.new()
\t\timg.expand_mode = TextureRect.EXPAND_IGNORE_SIZE
\t\timg.custom_minimum_size = Vector2(180, 50)
\t\timg.stretch_mode = TextureRect.STRETCH_KEEP_ASPECT_COVERED
\t\t# Set image texture if valid
\t\tif ResourceLoader.exists(item_image_path):
\t\t\timg.texture = load(item_image_path)
\t\tpart.add_child(img)
\t\t
\t\t_marquee_inner.add_child(part)

func _start_infinite_scroll() -> void:
\t_scroll_tween = create_tween().set_loops()
\tvar target_x: float = -300.0 # Match width of one marquee part
\t_scroll_tween.tween_property(_marquee_inner, "position:x", target_x, speed).from(0.0)

# Edge Detection Mouse Entrance
func _on_mouse_entered() -> void:
\tvar local_pos := get_local_mouse_position()
\tvar edge := _closest_edge(local_pos)
\t
\tif _tween and _tween.is_running():
\t\t_tween.kill()
\t\t
\t_tween = create_tween().set_parallel(true).set_trans(Tween.TRANS_EXPO).set_ease(Tween.EASE_OUT)
\t
\tvar start_y: float = -size.y if edge == "top" else size.y
\t_marquee_overlay.position.y = start_y
\t_tween.tween_property(_marquee_overlay, "position:y", 0.0, 0.5)

# Edge Detection Mouse Exit
func _on_mouse_exited() -> void:
\tvar local_pos := get_local_mouse_position()
\tvar edge := _closest_edge(local_pos)
\t
\tif _tween and _tween.is_running():
\t\t_tween.kill()
\t\t
\t_tween = create_tween().set_trans(Tween.TRANS_EXPO).set_ease(Tween.EASE_OUT)
\tvar target_y: float = -size.y if edge == "top" else size.y
\t_tween.tween_property(_marquee_overlay, "position:y", target_y, 0.5)

func _closest_edge(pos: Vector2) -> String:
\tvar dist_top := pos.distance_squared_to(Vector2(size.x / 2.0, 0.0))
\tvar dist_bottom := pos.distance_squared_to(Vector2(size.x / 2.0, size.y))
\treturn "top" if dist_top < dist_bottom else "bottom"

func _on_gui_input(event: InputEvent) -> void:
\tif event is InputEventMouseButton and event.button_index == MOUSE_BUTTON_LEFT and event.pressed:
\t\temit_signal("item_selected", item_text, item_link)

func _draw() -> void:
\tif show_top_border:
\t\tdraw_line(Vector2(0, 0), Vector2(size.x, 0), border_color, 2.0)
`;
      }, []);

      const tscnStructureGuide = `[gd_scene load_steps=3 format=3 uid="uid://flowing_menu_demo"]

[ext_resource type="Script" path="res://FlowingMenu.gd" id="1_flowing_menu"]

anchors_preset = 15
