<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vision Pro 空間照片 (RWD & 上傳版)</title>
  <style>
    /* 全局現代簡約亮色背景 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      /* 使用柔和的現代淺色漸層，襯托玻璃質感 */
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      padding: 20px;
    }

    /* 上傳區域 */
    .upload-area {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      
    }
    
    .input-group {
        display: flex;
        align-items: center;
        gap: 10px;
        background: #fff;
        padding: 10px;
        border-radius: 15px;
        border: 1px solid #ddd;
    }

    .input-group label {
      font-weight: 600;
      color: #333;
      white-space: nowrap;
    }

    input[type="file"] {
      display: none;
    }

    .custom-file-upload {
      display: inline-block;
      padding: 10px 20px;
      cursor: pointer;
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      color: white;
      border-radius: 12px;
      font-size: 0.9rem;
      border: none;
      transition: opacity 0.2s;
    }

    .custom-file-upload:hover {
        opacity: 0.8;
    }

    #bgLabel, #fgLabel {
        color: #555;
        font-size: 0.85rem;
    }

    /* 空間照片外層容器（提供 3D 視角深度） */
    .spatial-container {
      perspective: 1200px;
      touch-action: none; /* 防止滑動時頁面捲動，對移動端很重要 */
    }

    /* 照片卡片本體 */
    .spatial-card {
      position: relative;
      /* 響應式：預設 100% 寬度 */
      width: calc(100vw - 40px);
      height: 70vh; /* 響應式：高度根據視口 */
      /* 設有最大寬高，避免過大 */
      max-width: 420px;
      max-height: 560px;
      border-radius: 32px;
      /* 亮色系磨砂玻璃核心 */
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      
      /* 極細的白色高光邊框與柔和的環境雙重陰影 */
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: 
        0 10px 30px rgba(0, 0, 0, 0.04),
        0 30px 60px rgba(31, 38, 135, 0.07);
      
      padding: 24px;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out, box-shadow 0.3s ease;
      cursor: pointer;
      overflow: hidden;
      margin: 0 auto;
    }
    
    /* 滑鼠懸停時更強烈的陰影 */
    .spatial-card:hover {
        box-shadow: 
        0 10px 40px rgba(0, 0, 0, 0.06),
        0 35px 70px rgba(31, 38, 135, 0.1);
    }

    /* 移動端按住時的狀態 */
    .spatial-card:active {
         transition: transform 0.05s ease-out;
         box-shadow: 
        0 10px 40px rgba(0, 0, 0, 0.06),
        0 35px 70px rgba(31, 38, 135, 0.1);
    }

    /* 內部分層照片容器 */
    .photo-vault {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      overflow: hidden;
      transform: translateZ(20px); /* 讓照片內容在 Z 軸向上浮起 */
      background: #f0f3f8;
    }

    /* 視差層 1：背景層 (底圖) */
    .layer-bg {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 120%;
      height: 120%;
      background: #f0f3f8; /* 預設背景色 */
      transition: transform 0.1s ease-out;
      transform: scale(1);
    }

    /* 視差層 2：前景層 */
    .layer-fg {
      position: absolute;
      bottom: 0%;
      left: 50%;
      transform: translateX(-50%) translateZ(40px); /* 賦予更強的向前立體感 */
      width: 95%;
      height: 90%;
      transition: transform 0.1s ease-out;
      display: none; /* 預設隱藏，上傳後顯示 */
    }

    /* 確保背景和前景圖能正確縮放 */
    .layer-bg img, .layer-fg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    
    /* 前景圖可能不滿，所以用 object-fit: contain 保留比例 */
    .layer-fg img {
        object-fit: contain;
    }

    /* 動態高光折射層 (Glow Effect) */
    .shine-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 32px;
      pointer-events: none; /* 穿透點擊 */
      mix-blend-mode: overlay; /* 讓高光與下方完美融合 */
      opacity: 0;
      transition: opacity 0.3s ease;
      background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0) 60%);
      z-index: 10;
    }

    .spatial-card:hover .shine-overlay {
      opacity: 1;
    }

    /* 移動端啟用高光 */
    .spatial-card.moving .shine-overlay {
        opacity: 1;
    }

    /* 資訊文案區 */
    .info-tag {
      position: absolute;
      top: 40px;
      left: 40px;
      right: 40px; /* 防止文案過長 */
      color: #1d1d1f;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.5);
      transform: translateZ(50px); /* 浮在最頂層 */
    }

    .info-tag h3 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .info-tag p {
      font-size: 0.85rem;
      opacity: 0.7;
      margin-top: 4px;
    }

    /* 提示文字 */
    .placeholder-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #888;
        font-size: 0.9rem;
        text-align: center;
        width: 100%;
    }
    
    .uploaded .placeholder-text {
        display: none;
    }

  </style>
</head>
<body>

  <!-- 上傳區域 -->
  <div class="upload-area">
    <div class="input-group">
      <label>1. 背景圖 (16:9)</label>
      <label for="bgInput" class="custom-file-upload">上傳背景</label>
      <input type="file" id="bgInput" accept="image/jpeg, image/png">
      <span id="bgLabel"></span>
    </div>
    <div class="input-group">
      <label>2. 前景物件 (PNG)</label>
      <label for="fgInput" class="custom-file-upload">上傳前景</label>
      <input type="file" id="fgInput" accept="image/jpeg, image/png">
      <span id="fgLabel"></span>
    </div>
  </div>

  <div class="spatial-container">
    <div class="spatial-card" id="spatialCard">
      <div class="shine" id="shineOverlay"></div>
      
      <div class="photo-vault uploaded" id="photoVault">
         <div class="placeholder-text">請先上傳背景和前景圖...</div>
        <div class="layer-bg" id="layerBg">
          <img src="" alt="" id="bgImg">
        </div>
        <div class="layer-fg" id="layerFg">
          <img src="" alt="" id="fgImg">
        </div>
      </div>

      <div class="info-tag">
        <h3 id="tagTitle"></h3>
        <p id="tagDesc"></p>
      </div>
    </div>
  </div>

  <script>
    const card = document.getElementById('spatialCard');
    const shine = document.getElementById('shineOverlay');
    const bg = document.getElementById('layerBg');
    const fg = document.getElementById('layerFg');
    const bgImg = document.getElementById('bgImg');
    const fgImg = document.getElementById('fgImg');
    const photoVault = document.getElementById('photoVault');
    const bgInput = document.getElementById('bgInput');
    const fgInput = document.getElementById('fgInput');
    const bgLabel = document.getElementById('bgLabel');
    const fgLabel = document.getElementById('fgLabel');
    const tagTitle = document.getElementById('tagTitle');
    const tagDesc = document.getElementById('tagDesc');

    let bgUploaded = false;
    let fgUploaded = false;

    // --- 上傳功能 ---
    function handleFileUpload(input, imgElement, labelElement, isBg) {
      const file = input.files[0];
      if (file) {
        labelElement.textContent = file.name;
        const reader = new FileReader();
        reader.onload = (e) => {
          imgElement.src = e.target.result;
          if(isBg) {
            bgUploaded = true;
             tagDesc.textContent = "";
          } else {
            fgUploaded = true;
            fg.style.display = 'block'; // 顯示前景層
          }
          checkIfUploaded();
        };
        reader.readAsDataURL(file);
      }
    }

    function checkIfUploaded() {
      if (bgUploaded && fgUploaded) {
        photoVault.classList.add('uploaded');
        tagTitle.textContent = "";
      } else {
        photoVault.classList.remove('uploaded');
        tagTitle.textContent = "";
        
      }
    }

    bgInput.addEventListener('change', () => handleFileUpload(bgInput, bgImg, bgLabel, true));
    fgInput.addEventListener('change', () => handleFileUpload(fgInput, fgImg, fgLabel, false));

    // --- 空間視差效果核心代碼 ---
    function updateSpatialEffect(e, type) {
      const rect = card.getBoundingClientRect();
      let clientX, clientY;

      // 區分滑鼠事件與觸摸事件
      if (type === 'mouse') {
        clientX = e.clientX;
        clientY = e.clientY;
      } else {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      }

      // 計算在卡片內的相對座標 (-1 ~ 1)
      const x = (clientX - rect.left) / rect.width - 0.5;
      const y = (clientY - rect.top) / rect.height - 0.5;

      // 1. 卡片整體的 3D 傾斜角度控制
      const maxRotate = 10; // 移動端不宜角度過大，增加穩定感
      card.style.transform = `rotateX(${-y * maxRotate}deg) rotateY(${x * maxRotate}deg)`;

      // 2. 動態高光跟隨
      const mouseXPercentage = (clientX - rect.left) / rect.width * 100;
      const mouseYPercentage = (clientY - rect.top) / rect.height * 100;
      shine.style.background = `radial-gradient(circle at ${mouseXPercentage}% ${mouseYPercentage}%, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0) 70%)`;

      // 3. 核心：前後景深視差位移
      // 背景層移動方向與手勢相同（微幅移動）
      bg.style.transform = `translateX(${x * -10}px) translateY(${y * -10}px) scale(1.05)`;
      // 前景物件層移動方向與手勢相反，且幅度較大，拉開前後立體感
      fg.style.transform = `translateX(calc(-50% + ${x * 20}px)) translateY(${y * 20}px) translateZ(40px)`;
    }

    // --- 事件監聽器 (滑鼠 + 觸摸) ---

    // 進入狀態：取消過渡動畫
    function activateMovement() {
        card.style.transition = 'none';
        bg.style.transition = 'none';
        fg.style.transition = 'none';
        card.classList.add('moving');
    }

    // 還原狀態：優雅地還原
    function resetMovement() {
        card.style.transform = 'rotateX(0deg) rotateY(0deg)';
        bg.style.transform = 'translateX(0px) translateY(0px) scale(1)';
        fg.style.transform = 'translateX(-50%) translateY(0px) translateZ(40px)';
        // 增加過渡動畫讓還原更平滑
        card.style.transition = 'transform 0.5s ease-out, box-shadow 0.3s ease';
        bg.style.transition = 'transform 0.5s ease-out';
        fg.style.transition = 'transform 0.5s ease-out';
        card.classList.remove('moving');
    }

    // 滑鼠事件
    card.addEventListener('mousemove', (e) => updateSpatialEffect(e, 'mouse'));
    card.addEventListener('mouseleave', resetMovement);
    card.addEventListener('mouseenter', activateMovement);

    // 觸摸事件 (手機適應)
    card.addEventListener('touchstart', (e) => {
        activateMovement();
        updateSpatialEffect(e, 'touch');
    }, false);

    card.addEventListener('touchmove', (e) => {
        updateSpatialEffect(e, 'touch');
    }, false);

    card.addEventListener('touchend', resetMovement, false);
    card.addEventListener('touchcancel', resetMovement, false);

  </script>
</body>
</html>
