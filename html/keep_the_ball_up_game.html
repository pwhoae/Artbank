<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keep The Ball Up - 球不落地</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Fredoka', sans-serif;
            touch-action: none; /* Prevent scrolling on mobile touch */
            user-select: none;
        }

        .custom-glass {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .glow-text {
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
        }

        /* Bounce animation for game start screen */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 overflow-hidden relative select-none">

    <!-- Game Container -->
    <div class="relative w-full max-w-2xl h-[90vh] max-h-[800px] flex flex-col justify-between items-center rounded-3xl overflow-hidden shadow-2xl border border-slate-700/50 bg-gradient-to-b from-slate-900 via-indigo-950 to-slate-900">
        
        <!-- Header Bar / HUD -->
        <div class="w-full px-6 py-4 flex justify-between items-center z-10 custom-glass rounded-b-2xl">
            <!-- Score (Seconds elapsed) -->
            <div class="flex items-center space-x-3">
                <div class="p-2.5 bg-amber-500/20 rounded-xl text-amber-400 border border-amber-500/30">
                    <i class="fa-solid fa-stopwatch text-xl"></i>
                </div>
                <div>
                    <div class="text-xs text-slate-400 font-semibold tracking-wider uppercase">存活時間 / 得分</div>
                    <div class="text-2xl font-bold text-amber-400 tracking-wider"><span id="scoreText">0</span> <span class="text-sm font-normal">秒</span></div>
                </div>
            </div>

            <!-- Best Score -->
            <div class="flex items-center space-x-3">
                <div class="p-2.5 bg-emerald-500/20 rounded-xl text-emerald-400 border border-emerald-500/30">
                    <i class="fa-solid fa-trophy text-xl"></i>
                </div>
                <div class="text-right">
                    <div class="text-xs text-slate-400 font-semibold tracking-wider uppercase">最高紀錄</div>
                    <div class="text-2xl font-bold text-emerald-400 tracking-wider"><span id="bestScoreText">0</span> <span class="text-sm font-normal">秒</span></div>
                </div>
            </div>
        </div>

        <!-- Main Canvas -->
        <canvas id="gameCanvas" class="absolute inset-0 w-full h-full cursor-none z-0"></canvas>

        <!-- Dynamic Level/Difficulty Badge -->
        <div id="difficultyBadge" class="z-10 mt-2 px-4 py-1.5 rounded-full custom-glass text-xs text-indigo-300 font-medium tracking-wide flex items-center gap-2 opacity-0 transition-opacity duration-300">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="difficultyText">速度: 1.0x</span>
        </div>

        <!-- Start Game Screen Overlay -->
        <div id="startOverlay" class="absolute inset-0 z-20 flex flex-col items-center justify-center p-6 bg-slate-950/80 backdrop-blur-md">
            <div class="text-center max-w-md">
                <div class="inline-block p-4 rounded-3xl bg-gradient-to-tr from-indigo-500 to-pink-500 shadow-lg shadow-indigo-500/30 mb-6 animate-float">
                    <i class="fa-solid fa-table-tennis-paddle-ball text-5xl text-white"></i>
                </div>
                <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-indigo-200 to-pink-400 mb-2 glow-text">
                    球不落地
                </h1>
                <p class="text-slate-300 mb-8 text-sm sm:text-base leading-relaxed">
                    移動底部的擋板，彈開墜落的球！<br>
                    每存活 <span class="text-amber-400 font-bold">1 秒加 1 分</span>，球的速度會隨時間提升！
                </p>

                <button id="startBtn" class="w-full sm:w-auto px-8 py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold text-lg rounded-2xl shadow-lg shadow-emerald-500/30 hover:scale-105 active:scale-95 transition-all duration-200 flex items-center justify-center gap-3">
                    <i class="fa-solid fa-play"></i> 開始遊戲
                </button>
            </div>
        </div>

        <!-- Game Over Screen Overlay -->
        <div id="gameOverOverlay" class="hidden absolute inset-0 z-20 flex flex-col items-center justify-center p-6 bg-slate-950/85 backdrop-blur-md">
            <div class="text-center max-w-md w-full bg-slate-900/80 p-8 rounded-3xl border border-slate-800 shadow-2xl">
                <div class="w-16 h-16 rounded-2xl bg-rose-500/20 border border-rose-500/30 text-rose-400 flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-heart-crack text-3xl"></i>
                </div>
                <h2 class="text-3xl font-extrabold text-white mb-2">遊戲結束</h2>
                <p class="text-slate-400 text-sm mb-6">球掉落到底部了，再試一次吧！</p>

                <!-- Stats card -->
                <div class="bg-slate-800/60 rounded-2xl p-4 mb-6 grid grid-cols-2 gap-4 border border-slate-700/50">
                    <div class="text-center">
                        <div class="text-xs text-slate-400 mb-1">本次得分</div>
                        <div class="text-2xl font-bold text-amber-400"><span id="finalScore">0</span> 秒</div>
                    </div>
                    <div class="text-center border-l border-slate-700">
                        <div class="text-xs text-slate-400 mb-1">最佳紀錄</div>
                        <div class="text-2xl font-bold text-emerald-400"><span id="finalBestScore">0</span> 秒</div>
                    </div>
                </div>

                <button id="restartBtn" class="w-full py-4 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-400 hover:to-purple-500 text-white font-bold text-lg rounded-2xl shadow-lg shadow-indigo-500/30 hover:scale-[1.02] active:scale-95 transition-all duration-200 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> 重新開始
                </button>
            </div>
        </div>

        <!-- Bottom Controls / Tip Bar -->
        <div class="w-full py-3 px-4 text-center z-10 custom-glass rounded-t-2xl text-xs text-slate-400 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-computer-mouse text-slate-500"></i> 滑鼠/手勢移動
            </div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-keyboard text-slate-500"></i> 鍵盤 ← / → 移動
            </div>
        </div>
    </div>

    <script>
        // Web Audio API Synthesizer for sound effects without external audio files
        class SoundEffects {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playBounce() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playGameOver() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(250, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.4);

                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }
        }

        const sound = new SoundEffects();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Element references
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const scoreText = document.getElementById('scoreText');
        const bestScoreText = document.getElementById('bestScoreText');
        const finalScore = document.getElementById('finalScore');
        const finalBestScore = document.getElementById('finalBestScore');
        const difficultyBadge = document.getElementById('difficultyBadge');
        const difficultyText = document.getElementById('difficultyText');

        // Game state variables
        let isPlaying = false;
        let score = 0; // Score in seconds
        let bestScore = localStorage.getItem('keepBallUp_bestScore') || 0;
        let startTime = 0;
        let timerInterval = null;
        let animationFrameId = null;

        // Visual effects: Particles
        let particles = [];

        // Paddle Configuration
        const paddle = {
            width: 120,
            height: 18,
            x: 0,
            y: 0,
            color: '#6366f1', // Indigo
            glowColor: '#818cf8',
            targetX: 0,
            speed: 0.25 // Smooth interpolation factor
        };

        // Ball Configuration
        const ball = {
            x: 0,
            y: 0,
            radius: 12,
            vx: 0,
            vy: 0,
            baseSpeed: 5,
            speedMultiplier: 1.0,
            color: '#f59e0b', // Amber/Gold
            trail: []
        };

        // Key controls state
        const keys = {
            Left: false,
            Right: false
        };

        // Initialize score display
        bestScoreText.innerText = bestScore;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            // Update paddle Y position relative to canvas bottom
            paddle.y = canvas.height - 45;

            // Keep paddle within canvas bounds after resize
            if (paddle.x > canvas.width - paddle.width) {
                paddle.x = canvas.width - paddle.width;
            }
        }

        window.addEventListener('resize', resizeCanvas);

        function handleMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            paddle.targetX = mouseX - paddle.width / 2;
        }

        function handleTouchMove(e) {
            if (e.touches.length > 0) {
                const rect = canvas.getBoundingClientRect();
                const touchX = e.touches[0].clientX - rect.left;
                paddle.targetX = touchX - paddle.width / 2;
            }
        }

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('touchmove', handleTouchMove, { passive: true });
        window.addEventListener('touchstart', handleTouchMove, { passive: true });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = false;
        });

        function createParticles(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 3 + 2,
                    color: color,
                    alpha: 1,
                    life: Math.random() * 20 + 20
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 1 / p.life;
                p.radius *= 0.96;

                if (p.alpha <= 0 || p.radius <= 0.5) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function resetGame() {
            resizeCanvas();

            // Reset Paddle Position
            paddle.x = (canvas.width - paddle.width) / 2;
            paddle.targetX = paddle.x;

            // Reset Ball Position & Speed
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 3;
            ball.speedMultiplier = 1.0;
            ball.trail = [];

            // Random initial bounce direction (upwards)
            const angle = (Math.random() * 60 - 30) * (Math.PI / 180); // -30deg to +30deg
            const initialSpeed = ball.baseSpeed;
            ball.vx = initialSpeed * Math.sin(angle);
            ball.vy = -initialSpeed * Math.cos(angle);

            // Reset Score & Timer
            score = 0;
            scoreText.innerText = '0';
            difficultyBadge.style.opacity = '1';
            difficultyText.innerText = '速度: 1.0x';

            particles = [];
        }

        function startGame() {
            sound.init();
            resetGame();

            isPlaying = true;
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');

            // Timer: Add 1 point every 1 second
            startTime = Date.now();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (isPlaying) {
                    score = Math.floor((Date.now() - startTime) / 1000);
                    scoreText.innerText = score;

                    // Gradually increase ball speed every 5 seconds
                    ball.speedMultiplier = 1.0 + Math.floor(score / 5) * 0.08;
                    difficultyText.innerText = `速度: ${ball.speedMultiplier.toFixed(1)}x`;
                }
            }, 100);

            // Start main game loop
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function gameOver() {
            isPlaying = false;
            clearInterval(timerInterval);
            sound.playGameOver();

            // Update high score
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('keepBallUp_bestScore', bestScore);
                bestScoreText.innerText = bestScore;
            }

            finalScore.innerText = score;
            finalBestScore.innerText = bestScore;

            // Display Game Over Overlay
            gameOverOverlay.classList.remove('hidden');
        }

        function update() {
            if (!isPlaying) return;

            // Handle keyboard smooth movement
            const keySpeed = 15;
            if (keys.Left) paddle.targetX -= keySpeed;
            if (keys.Right) paddle.targetX += keySpeed;

            // Smooth paddle movement toward target position
            paddle.targetX = Math.max(0, Math.min(canvas.width - paddle.width, paddle.targetX));
            paddle.x += (paddle.targetX - paddle.x) * paddle.speed;

            // Calculate current total ball speed based on multiplier
            const currentSpeedScale = ball.speedMultiplier;
            
            // Move ball
            ball.x += ball.vx * currentSpeedScale;
            ball.y += ball.vy * currentSpeedScale;

            // Store tail history for visual trace
            ball.trail.push({ x: ball.x, y: ball.y });
            if (ball.trail.length > 8) ball.trail.shift();

            // Wall Collision: Left & Right
            if (ball.x - ball.radius <= 0) {
                ball.x = ball.radius;
                ball.vx *= -1;
                sound.playBounce();
                createParticles(ball.x, ball.y, '#38bdf8', 6);
            } else if (ball.x + ball.radius >= canvas.width) {
                ball.x = canvas.width - ball.radius;
                ball.vx *= -1;
                sound.playBounce();
                createParticles(ball.x, ball.y, '#38bdf8', 6);
            }

            // Wall Collision: Top
            if (ball.y - ball.radius <= 0) {
                ball.y = ball.radius;
                ball.vy *= -1;
                sound.playBounce();
                createParticles(ball.x, ball.y, '#38bdf8', 6);
            }

            // Paddle Collision Logic
            if (
                ball.vy > 0 && // Moving downwards
                ball.y + ball.radius >= paddle.y &&
                ball.y - ball.radius <= paddle.y + paddle.height &&
                ball.x + ball.radius >= paddle.x &&
                ball.x - ball.radius <= paddle.x + paddle.width
            ) {
                // Bounce back up
                ball.y = paddle.y - ball.radius;

                // Calculate hit position relative to paddle center (-1 to +1)
                const hitPos = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);

                // Dynamically adjust bounce angle based on where the ball hit the paddle
                const maxAngle = 60 * (Math.PI / 180); // max 60 degrees angle
                const bounceAngle = hitPos * maxAngle;
                const currentSpeed = Math.hypot(ball.vx, ball.vy);

                ball.vx = currentSpeed * Math.sin(bounceAngle);
                ball.vy = -currentSpeed * Math.cos(bounceAngle);

                sound.playBounce();
                createParticles(ball.x, ball.y + ball.radius, '#f59e0b', 14);
            }

            // Bottom Boundary: Game Over
            if (ball.y - ball.radius > canvas.height) {
                createParticles(ball.x, canvas.height - 10, '#ef4444', 25);
                gameOver();
            }

            updateParticles();
        }

        function draw() {
            // Clear canvas background
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw subtle background grid pattern
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            if (isPlaying || particles.length > 0) {
                // Draw Particles
                drawParticles();

                // Draw Ball Trail Effect
                for (let i = 0; i < ball.trail.length; i++) {
                    const pt = ball.trail[i];
                    const alpha = (i + 1) / ball.trail.length * 0.4;
                    const r = ball.radius * ((i + 1) / ball.trail.length);

                    ctx.save();
                    ctx.fillStyle = ball.color;
                    ctx.globalAlpha = alpha;
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // Draw Glowing Ball
                ctx.save();
                ctx.shadowColor = ball.color;
                ctx.shadowBlur = 18;
                ctx.fillStyle = ball.color;
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fill();

                // Ball inner highlight shine
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.beginPath();
                ctx.arc(ball.x - ball.radius * 0.3, ball.y - ball.radius * 0.3, ball.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Draw Glowing Paddle
                ctx.save();
                ctx.shadowColor = paddle.glowColor;
                ctx.shadowBlur = 15;

                // Paddle gradient background
                const grad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x + paddle.width, paddle.y);
                grad.addColorStop(0, '#818cf8');
                grad.addColorStop(0.5, '#6366f1');
                grad.addColorStop(1, '#4f46e5');
                ctx.fillStyle = grad;

                // Rounded rectangle paddle
                const radius = 9;
                ctx.beginPath();
                ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, radius);
                ctx.fill();

                // Paddle top highlight border
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.beginPath();
                ctx.roundRect(paddle.x + 4, paddle.y + 2, paddle.width - 8, 3, 2);
                ctx.fill();

                ctx.restore();
            }
        }

        function gameLoop() {
            update();
            draw();

            if (isPlaying) {
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }

        // Event Listeners for UI buttons
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // Initial Canvas setup on load
        window.onload = () => {
            resizeCanvas();
        };
    </script>
</body>
</html>
