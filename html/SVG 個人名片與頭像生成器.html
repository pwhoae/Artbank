  <script>
    /**

      const RANDOM_PROFILES = [

      const state = {

      // ==========================================

      const els = {
        inputName: document.getElementById('input-name'),

      // ==========================================
      // 3. 工具函式：安全跳脫、雜湊隨機、文字換行
      // ==========================================
      function escapeXml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&apos;');
      }

      // 根據字串與偏移量產生確定性種子 (0 ~ 2^32-1)
      function getHashSeed(str, offset = 0) {
        let h = 2166136261 ^ offset;
        for (let i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      }

      // 建立偽隨機數生成器 (Mulberry32)
      function createRng(seed) {
        let a = seed;
        return function () {
          let t = (a += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      // 計算字元視覺寬度（全形/中文字算 2，半形/英文算 1.05）
      function getCharVisualWidth(ch) {
        return ch.charCodeAt(0) > 255 ? 2 : 1.05;
      }

      // 將自我介紹文字依視覺寬度自動切分為多行
      function wrapTextLines(text, maxUnitsPerLine = 42, maxLines = 3) {
        const clean = (text || '').replace(/\s+/g, ' ').trim();
        if (!clean) return ['在左側輸入您的自我介紹，系統將自動為您排版。'];

        const lines = [];
        let currentLine = '';
        let currentUnits = 0;

        for (let i = 0; i < clean.length; i++) {
          const ch = clean[i];
          const w = getCharVisualWidth(ch);

          if (currentUnits + w > maxUnitsPerLine && currentLine.length > 0) {
            lines.push(currentLine.trim());
            currentLine = ch;
            currentUnits = w;
            if (lines.length >= maxLines) break;
          } else {
            currentLine += ch;
            currentUnits += w;
          }
        }

        if (lines.length < maxLines && currentLine.trim()) {
          lines.push(currentLine.trim());
        } else if (lines.length === maxLines && currentLine.trim()) {
          // 若超過最大行數，在最後一行加上省略號
          const last = lines[maxLines - 1];
          lines[maxLines - 1] = last.slice(0, Math.max(0, last.length - 1)) + '…';
        }

        return lines;
      }

      // 顯示自訂 Toast 通知 (不使用 alert)
      function showToast(message, type = 'success') {
        const toast = document.createElement('div');
        const bgClass = type === 'error' ? 'bg-rose-600' : 'bg-slate-900';
        toast.className = `${bgClass} text-white text-xs sm:text-sm font-medium px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 transform transition-all duration-300 translate-y-2 opacity-0`;
        toast.innerHTML = `
          <span class="w-2 h-2 rounded-full ${type === 'error' ? 'bg-rose-300' : 'bg-emerald-400'}"></span>
          <span>${escapeXml(message)}</span>
        `;
        els.toastContainer.appendChild(toast);

        requestAnimationFrame(() => {
          toast.classList.remove('translate-y-2', 'opacity-0');
        });

        setTimeout(() => {
          toast.classList.add('translate-y-2', 'opacity-0');
          setTimeout(() => toast.remove(), 300);
        }, 2600);
      }

      // ==========================================
      // 4. SVG 向量頭像生成引擎 (200x200 內部座標系)
      // ==========================================
      function buildAvatarInnerSvg(theme) {
        const seed = getHashSeed(state.name + state.role, state.seedOffset);
        const rng = createRng(seed);
        const pick = (arr) => arr[Math.floor(rng() * arr.length)];

        const palette = [
          theme.accent,
          theme.accentSecondary,
          '#f43f5e',
          '#f59e0b',
          '#10b981',
          '#8b5cf6',
          '#ec4899'
        ];
        const c1 = pick(palette);
        let c2 = pick(palette);
        if (c2 === c1) c2 = theme.accentSecondary;

        // 背景裝飾光暈
        let inner = `
          <rect width="200" height="200" fill="${theme.avatarBg}" />
          <circle cx="${40 + rng() * 120}" cy="${40 + rng() * 120}" r="${65 + rng() * 35}" fill="${c1}" opacity="0.18" />
          <circle cx="${30 + rng() * 140}" cy="${140 + rng() * 50}" r="${50 + rng() * 30}" fill="${c2}" opacity="0.18" />
        `;

        const style = state.avatarStyle;

        if (style === 'bot') {
          // 風格 A：可愛向量機器人
          const headRx = 22 + Math.floor(rng() * 16);
          const eyeType = Math.floor(rng() * 3);
          const antennaType = Math.floor(rng() * 2);
          const mouthType = Math.floor(rng() * 3);

          // 天線
          if (antennaType === 0) {
            inner += `
              <line x1="100" y1="46" x2="100" y2="24" stroke="${c2}" stroke-width="6" stroke-linecap="round" />
              <circle cx="100" cy="20" r="8" fill="${c1}" />
            `;
          } else {
            inner += `
              <line x1="72" y1="48" x2="62" y2="26" stroke="${c2}" stroke-width="5" stroke-linecap="round" />
              <line x1="128" y1="48" x2="138" y2="26" stroke="${c2}" stroke-width="5" stroke-linecap="round" />
              <circle cx="62" cy="24" r="6" fill="${c1}" />
              <circle cx="138" cy="24" r="6" fill="${c1}" />
            `;
          }

          // 耳朵與頭部主體
          inner += `
            <rect x="34" y="84" width="14" height="34" rx="7" fill="${c2}" />
            <rect x="152" y="84" width="14" height="34" rx="7" fill="${c2}" />
            <rect x="46" y="46" width="108" height="104" rx="${headRx}" fill="${c1}" />
            <rect x="58" y="60" width="84" height="76" rx="${Math.max(12, headRx - 8)}" fill="#0f172a" opacity="0.88" />
          `;

          // 眼睛
          if (eyeType === 0) {
            inner += `
              <circle cx="82" cy="92" r="10" fill="#38bdf8" />
              <circle cx="118" cy="92" r="10" fill="#38bdf8" />
              <circle cx="85" cy="89" r="3" fill="#ffffff" />
              <circle cx="121" cy="89" r="3" fill="#ffffff" />
            `;
          } else if (eyeType === 1) {
            inner += `
              <path d="M72 94 Q82 82 92 94" stroke="#34d399" stroke-width="5" fill="none" stroke-linecap="round" />
              <path d="M108 94 Q118 82 128 94" stroke="#34d399" stroke-width="5" fill="none" stroke-linecap="round" />
            `;
          } else {
            inner += `
              <rect x="70" y="85" width="60" height="14" rx="7" fill="${c2}" />
              <circle cx="84" cy="92" r="4" fill="#ffffff" />
              <circle cx="116" cy="92" r="4" fill="#ffffff" />
            `;
          }

          // 嘴巴
          if (mouthType === 0) {
            inner += `<path d="M84 115 Q100 126 116 115" stroke="#f8fafc" stroke-width="4.5" fill="none" stroke-linecap="round" />`;
          } else if (mouthType === 1) {
            inner += `<rect x="82" y="112" width="36" height="8" rx="4" fill="#38bdf8" opacity="0.85" />`;
          } else {
            inner += `
              <circle cx="88" cy="116" r="3.5" fill="#fbbf24" />
              <circle cx="100" cy="116" r="3.5" fill="#fbbf24" />
              <circle cx="112" cy="116" r="3.5" fill="#fbbf24" />
            `;
          }

          // 肩膀底座
          inner += `<path d="M62 195 C62 166, 138 166, 138 195 Z" fill="${c2}" />`;

        } else if (style === 'minimal') {
          // 風格 B：極簡幾何人像
          const skinColors = ['#fed7aa', '#fde68a', '#fbcfe8', '#e2e8f0', '#fdba74'];
          const hairColors = ['#1e293b', '#312e81', '#7c2d12', '#0f766e', '#4c1d95'];
          const skin = pick(skinColors);
          const hair = pick(hairColors);
          const hasGlasses = rng() > 0.45;
          const hairVariant = Math.floor(rng() * 3);

          // 肩膀衣服
          inner += `<path d="M36 200 C36 152, 164 152, 164 200 Z" fill="${c1}" />`;
          // 領口裝飾
          inner += `<polygon points="84,158 100,180 116,158" fill="#ffffff" opacity="0.85" />`;
          // 脖子與臉部
          inner += `
            <rect x="88" y="128" width="24" height="34" rx="10" fill="${skin}" />
            <rect x="66" y="54" width="68" height="84" rx="34" fill="${skin}" />
          `;

          // 髮型
          if (hairVariant === 0) {
            inner += `<path d="M64 86 C64 40, 136 40, 136 86 C126 68, 74 68, 64 86 Z" fill="${hair}" />`;
          } else if (hairVariant === 1) {
            inner += `
              <circle cx="100" cy="44" r="18" fill="${hair}" />
              <path d="M64 84 C64 44, 136 44, 136 84 C120 72, 80 72, 64 84 Z" fill="${hair}" />
            `;
          } else {
            inner += `<path d="M62 92 C60 38, 140 38, 138 92 L132 74 L100 66 L68 74 Z" fill="${hair}" />`;
          }

          // 眼睛與微笑
          inner += `
            <circle cx="86" cy="96" r="4" fill="#1e293b" />
            <circle cx="114" cy="96" r="4" fill="#1e293b" />
            <path d="M91 114 Q100 122 109 114" stroke="#1e293b" stroke-width="3.5" fill="none" stroke-linecap="round" />
          `;

          // 眼鏡配件
          if (hasGlasses) {
            inner += `
              <circle cx="86" cy="96" r="11" stroke="${c2}" stroke-width="3.5" fill="none" />
              <circle cx="114" cy="96" r="11" stroke="${c2}" stroke-width="3.5" fill="none" />
              <line x1="97" y1="96" x2="103" y2="96" stroke="${c2}" stroke-width="3.5" />
            `;
          }

        } else if (style === 'abstract') {
          // 風格 C：包浩斯幾何圖騰 (對稱與黃金比例分割)
          const shapes = [];
          for (let i = 0; i < 6; i++) {
            const color = i % 2 === 0 ? c1 : c2;
            const opacity = (0.45 + rng() * 0.5).toFixed(2);
            const type = Math.floor(rng() * 3);
            const x = 35 + Math.floor(rng() * 80);
            const y = 35 + Math.floor(rng() * 80);
            const size = 40 + Math.floor(rng() * 65);

            if (type === 0) {
              shapes.push(`<circle cx="${x + size / 2}" cy="${y + size / 2}" r="${size / 2}" fill="${color}" opacity="${opacity}" />`);
            } else if (type === 1) {
              const rot = Math.floor(rng() * 4) * 45;
              shapes.push(`<rect x="${x}" y="${y}" width="${size}" height="${size}" rx="12" fill="${color}" opacity="${opacity}" transform="rotate(${rot} ${x + size / 2} ${y + size / 2})" />`);
            } else {
              shapes.push(`<polygon points="${x + size / 2},${y} ${x + size},${y + size} ${x},${y + size}" fill="${color}" opacity="${opacity}" />`);
            }
          }
          inner += shapes.join('\n');
          // 中心亮點
          inner += `<circle cx="100" cy="100" r="22" fill="${theme.isDark ? '#0f172a' : '#ffffff'}" opacity="0.9" />`;
          inner += `<circle cx="100" cy="100" r="10" fill="${theme.accent}" />`;

        } else {
          // 風格 D：字母徽章 (Monogram)
          const cleanName = (state.name || 'User').trim();
          // 取得第一個字元或英文首字母
          const initials = cleanName
            .split(/\s+/)
            .map((part) => Array.from(part)[0] || '')
            .join('')
            .slice(0, 2)
            .toUpperCase() || 'ID';

          inner += `
            <circle cx="100" cy="100" r="76" fill="none" stroke="${c1}" stroke-width="6" stroke-dasharray="14 8" />
            <circle cx="100" cy="100" r="62" fill="${c1}" />
            <text x="100" y="104" text-anchor="middle" dominant-baseline="middle"
                  font-family="'Inter', 'Noto Sans TC', sans-serif" font-weight="700" font-size="54" fill="#ffffff" letter-spacing="2">
              ${escapeXml(initials)}
            </text>
          `;
        }

        return inner;
      }

      // ==========================================
      // 5. 生成完整 SVG 文件字串（名片 & 獨立頭像）
      // ==========================================
      function generateCardSvgString() {
        const theme = THEMES.find((t) => t.id === state.themeId) || THEMES[0];
        const safeName = escapeXml(state.name.trim() || '您的姓名');
        const safeRole = escapeXml(state.role.trim() || '個人頭銜 / 專業領域');
        const safeContact = escapeXml(state.contact.trim() || 'yourname.me');

        // 處理自我介紹多行排版
        const bioLines = wrapTextLines(state.bio, 42, 3);
        const bioSvgLines = bioLines
          .map(
            (line, idx) =>
              `<tspan x="275" dy="${idx === 0 ? 0 : 28}">${escapeXml(line)}</tspan>`
          )
          .join('');

        // 處理技能/關鍵字標籤 (最多取前 3 個)
        const tagList = state.tags
          .split(/[,，、]/)
          .map((t) => t.trim())
          .filter(Boolean)
          .slice(0, 3);

        let currentTagX = 275;
        const tagsSvg = tagList
          .map((tag) => {
            // 估算標籤寬度
            let units = 0;
            for (const ch of tag) units += getCharVisualWidth(ch);
            const pillWidth = Math.max(68, Math.round(units * 8.5 + 28));
            const x = currentTagX;
            currentTagX += pillWidth + 10;
            if (x + pillWidth > 760) return ''; // 避免超出名片右邊界

            return `
              <g transform="translate(${x}, 322)">
                <rect width="${pillWidth}" height="30" rx="15" fill="${theme.tagBg}" />
                <text x="${pillWidth / 2}" y="19" text-anchor="middle"
                      font-family="'Inter', 'Noto Sans TC', sans-serif" font-size="13" font-weight="600" fill="${theme.tagText}">
                  ${escapeXml(tag)}
                </text>
              </g>
            `;
          })
          .join('');

        const avatarInner = buildAvatarInnerSvg(theme);

        return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="${theme.bgStart}" />
      <stop offset="100%" stop-color="${theme.bgEnd}" />
    </linearGradient>
    <linearGradient id="accent-bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="${theme.accent}" />
      <stop offset="100%" stop-color="${theme.accentSecondary}" />
    </linearGradient>
    <clipPath id="avatar-circle-clip">
      <circle cx="100" cy="100" r="88" />
    </clipPath>
    <pattern id="subtle-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="${theme.textSecondary}" opacity="0.12" />
    </pattern>
  </defs>

  <!-- 名片底板 -->
  <rect x="2" y="2" width="796" height="456" rx="28" fill="url(#card-bg-grad)" stroke="${theme.cardBorder}" stroke-width="2" />
  <rect x="2" y="2" width="796" height="456" rx="28" fill="url(#subtle-grid)" />

  <!-- 右上角裝飾幾何光圈 -->
  <circle cx="760" cy="40" r="140" fill="${theme.accent}" opacity="0.07" />
  <circle cx="720" cy="440" r="110" fill="${theme.accentSecondary}" opacity="0.07" />

  <!-- 頂部品牌色條 -->
  <rect x="44" y="34" width="64" height="6" rx="3" fill="url(#accent-bar-grad)" />

  <!-- 左側頭像區塊 -->
  <g transform="translate(46, 118)">
    <!-- 頭像外框光環 -->
    <circle cx="100" cy="100" r="95" fill="none" stroke="url(#accent-bar-grad)" stroke-width="3" opacity="0.85" />
    <g clip-path="url(#avatar-circle-clip)">
      ${avatarInner}
    </g>
    <!-- 線上狀態小徽章 -->
    <circle cx="166" cy="166" r="14" fill="${theme.bgStart}" />
    <circle cx="166" cy="166" r="9" fill="#10b981" />
  </g>

  <!-- 右側個人資訊區 -->
  <!-- 姓名 -->
  <text x="275" y="106" font-family="'Inter', 'Noto Sans TC', sans-serif" font-size="34" font-weight="700" fill="${theme.textPrimary}" letter-spacing="-0.5">
    ${safeName}
  </text>

  <!-- 職稱 -->
  <text x="275" y="142" font-family="'Inter', 'Noto Sans TC', sans-serif" font-size="17" font-weight="600" fill="${theme.accent}">
    ${safeRole}
  </text>

  <!-- 分隔線 -->
  <line x1="275" y1="166" x2="745" y2="166" stroke="${theme.cardBorder}" stroke-width="1.5" opacity="0.7" />

  <!-- 自我介紹多行文字 -->
  <text x="275" y="204" font-family="'Inter', 'Noto Sans TC', sans-serif" font-size="16" font-weight="400" fill="${theme.textSecondary}">
    ${bioSvgLines}
  </text>

  <!-- 關鍵字標籤 -->
  ${tagsSvg}

  <!-- 底部聯絡資訊列 -->
  <g transform="translate(275, 396)">
    <rect x="0" y="-16" width="8" height="8" rx="2" fill="${theme.accent}" />
    <text x="18" y="-8" font-family="'Inter', 'Noto Sans TC', sans-serif" font-size="14" font-weight="500" fill="${theme.textSecondary}">
      ${safeContact}
    </text>
  </g>
</svg>`;
      }

      function generateStandaloneAvatarSvgString() {
        const theme = THEMES.find((t) => t.id === state.themeId) || THEMES[0];
        const avatarInner = buildAvatarInnerSvg(theme);

        return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <clipPath id="standalone-avatar-clip">
      <rect x="4" y="4" width="192" height="192" rx="48" />
    </clipPath>
  </defs>
  <g clip-path="url(#standalone-avatar-clip)">
    ${avatarInner}
  </g>
  <rect x="4" y="4" width="192" height="192" rx="48" fill="none" stroke="${theme.accent}" stroke-width="4" opacity="0.6" />
</svg>`;
      }

      // ==========================================
      // 6. UI 渲染與互動更新
      // ==========================================
      function renderThemeButtons() {
        els.themeSelector.innerHTML = THEMES.map((theme) => {
          const isSelected = theme.id === state.themeId;
          return `
            <button type="button" data-theme-id="${theme.id}"
              class="theme-btn flex items-center gap-2 p-2 rounded-xl border text-left transition-all ${
                isSelected
                  ? 'border-indigo-600 bg-indigo-50/70 ring-2 ring-indigo-500/20'
                  : 'border-slate-200 hover:border-slate-300 bg-white'
              }">
              <span class="w-5 h-5 rounded-full shrink-0 shadow-inner ${theme.previewColor}"></span>
              <span class="text-xs font-semibold text-slate-700 truncate">${theme.name}</span>
            </button>
          `;
        }).join('');

        // 綁定點擊事件
        document.querySelectorAll('.theme-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.themeId = btn.dataset.themeId;
            renderThemeButtons();
            updatePreview();
          });
        });
      }

      function updatePreview() {
        // 更新字數統計
        els.bioCounter.textContent = `${els.inputBio.value.length} / 90`;

        // 注入 SVG
        els.previewCardWrapper.innerHTML = generateCardSvgString();
        els.previewAvatarWrapper.innerHTML = generateStandaloneAvatarSvgString();
      }

      function switchTab(tab) {
        state.activeTab = tab;
        if (tab === 'card') {
          els.tabCard.className = 'px-3.5 py-1.5 text-xs font-semibold rounded-lg bg-white text-slate-900 shadow-sm transition-all';
          els.tabAvatar.className = 'px-3.5 py-1.5 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition-all';
          els.previewCardWrapper.classList.remove('hidden');
          els.previewAvatarWrapper.classList.add('hidden');
          els.exportHint.innerHTML = '目前選擇：<strong class="text-slate-600">完整個人名片</strong>（支援無限縮放 SVG 或高解析 PNG）';
        } else {
          els.tabAvatar.className = 'px-3.5 py-1.5 text-xs font-semibold rounded-lg bg-white text-slate-900 shadow-sm transition-all';
          els.tabCard.className = 'px-3.5 py-1.5 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition-all';
          els.previewAvatarWrapper.classList.remove('hidden');
          els.previewCardWrapper.classList.add('hidden');
          els.exportHint.innerHTML = '目前選擇：<strong class="text-slate-600">獨立向量頭像</strong>（適合用作社群大頭貼或網站 Logo）';
        }
      }

      // ==========================================
      // 7. 匯出功能 (SVG 下載 / PNG 轉換下載 / 複製程式碼)
      // ==========================================
      function getCurrentExportData() {
        const cleanSlug = (state.name || 'profile')
          .trim()
          .toLowerCase()
          .replace(/[^a-z0-9\u4e00-\u9fa5]+/g, '-')
          .replace(/^-|-$/g, '') || 'profile';

        if (state.activeTab === 'card') {
          return {
            svgString: generateCardSvgString(),
            filenameBase: `${cleanSlug}-card`,
            width: 1600, // 2x 高解析度
            height: 920
          };
        } else {
          return {
            svgString: generateStandaloneAvatarSvgString(),
            filenameBase: `${cleanSlug}-avatar`,
            width: 800, // 2x 高解析度
            height: 800
          };
        }
      }

      function triggerDownload(url, filename) {
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      // 匯出 SVG
      els.btnExportSvg.addEventListener('click', () => {
        try {
          const { svgString, filenameBase } = getCurrentExportData();
          const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          triggerDownload(url, `${filenameBase}.svg`);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showToast(`已成功匯出 ${filenameBase}.svg`);
        } catch (err) {
          console.error(err);
          showToast('匯出 SVG 時發生錯誤', 'error');
        }
      });

      // 匯出 PNG
      els.btnExportPng.addEventListener('click', () => {
        try {
          const { svgString, filenameBase, width, height } = getCurrentExportData();
          const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
          const url = URL.createObjectURL(svgBlob);

          const img = new Image();
          img.onload = () => {
            const canvas = els.exportCanvas;
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);
            URL.revokeObjectURL(url);

            canvas.toBlob((pngBlob) => {
              if (!pngBlob) {
                showToast('PNG 轉檔失敗', 'error');
                return;
              }
              const pngUrl = URL.createObjectURL(pngBlob);
              triggerDownload(pngUrl, `${filenameBase}.png`);
              setTimeout(() => URL.revokeObjectURL(pngUrl), 1000);
              showToast(`已成功匯出高畫質 ${filenameBase}.png`);
            }, 'image/png');
          };
          img.onerror = () => {
            URL.revokeObjectURL(url);
            showToast('無法渲染 PNG 影像', 'error');
          };
          img.src = url;
        } catch (err) {
          console.error(err);
          showToast('匯出 PNG 時發生錯誤', 'error');
        }
      });

      // 複製 SVG 原始碼 (使用 document.execCommand 確保在 iframe 中相容)
      els.btnCopySvg.addEventListener('click', () => {
        try {
          const { svgString } = getCurrentExportData();
          els.clipboardHelper.value = svgString;
          els.clipboardHelper.select();
          els.clipboardHelper.setSelectionRange(0, 99999);
          const success = document.execCommand('copy');
          if (success) {
            showToast('已將 SVG 原始碼複製到剪貼簿');
          } else {
            showToast('複製失敗，請嘗試直接下載檔案', 'error');
          }
        } catch (err) {
          console.error(err);
          showToast('複製剪貼簿失敗', 'error');
        }
      });

      // ==========================================
      // 8. 綁定表單與按鈕事件
      // ==========================================
      els.inputName.addEventListener('input', (e) => {
        state.name = e.target.value;
        updatePreview();
      });

      els.inputRole.addEventListener('input', (e) => {
        state.role = e.target.value;
        updatePreview();
      });

      els.inputBio.addEventListener('input', (e) => {
        state.bio = e.target.value;
        updatePreview();
      });

      els.inputTags.addEventListener('input', (e) => {
        state.tags = e.target.value;
        updatePreview();
      });

      els.inputContact.addEventListener('input', (e) => {
        state.contact = e.target.value;
        updatePreview();
      });

      els.selectAvatarStyle.addEventListener('change', (e) => {
        state.avatarStyle = e.target.value;
        updatePreview();
      });

      els.btnRerollAvatar.addEventListener('click', () => {
        state.seedOffset = Math.floor(Math.random() * 100000);
        updatePreview();
      });

      els.btnRandomFill.addEventListener('click', () => {
        const candidates = RANDOM_PROFILES.filter((p) => p.name !== state.name);
        const chosen = candidates[Math.floor(Math.random() * candidates.length)];
        state.name = chosen.name;
        state.role = chosen.role;
        state.bio = chosen.bio;
        state.tags = chosen.tags;
        state.contact = chosen.contact;
        state.themeId = chosen.themeId;
        state.avatarStyle = chosen.avatarStyle;
        state.seedOffset = Math.floor(Math.random() * 100000);

        // 同步更新表單欄位
        els.inputName.value = state.name;
        els.inputRole.value = state.role;
        els.inputBio.value = state.bio;
        els.inputTags.value = state.tags;
        els.inputContact.value = state.contact;
        els.selectAvatarStyle.value = state.avatarStyle;

        renderThemeButtons();
        updatePreview();
        showToast('已套用隨機範例靈感！');
      });

      els.tabCard.addEventListener('click', () => switchTab('card'));
      els.tabAvatar.addEventListener('click', () => switchTab('avatar'));

      // 初始渲染
      renderThemeButtons();
      updatePreview();
    });
  </script>
