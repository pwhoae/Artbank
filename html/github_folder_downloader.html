<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub 資料夾選取下載器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-800 mb-2">GitHub Folder Downloader</h1>
            <p class="text-slate-600">輸入儲存庫連結，勾選你需要的資料夾並打包下載</p>
        </header>

        <!-- Input Section -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6">
            <div class="flex flex-col md:flex-row gap-4">
                <input 
                    type="text" 
                    id="repoUrl" 
                    placeholder="例如: https://github.com/facebook/react" 
                    class="flex-1 px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
                >
                <button 
                    onclick="fetchRepoStructure()" 
                    id="fetchBtn"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-semibold transition-colors flex items-center justify-center gap-2"
                >
                    <span>解析結構</span>
                </button>
            </div>
            <p id="statusMsg" class="mt-3 text-sm text-slate-500 hidden"></p>
        </div>

        <div id="selectionArea" class="hidden space-y-4">
            <div class="flex justify-between items-center bg-white p-4 rounded-xl border border-slate-200">
                <div class="flex gap-4">
                    <button onclick="toggleAll(true)" class="text-sm text-blue-600 hover:underline">全選</button>
                    <button onclick="toggleAll(false)" class="text-sm text-slate-500 hover:underline">取消全選</button>
                </div>
                <div id="stats" class="text-sm text-slate-600 font-medium"></div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div id="folderTree" class="max-height-[500px] overflow-y-auto custom-scrollbar p-4 space-y-1">
                    <!-- Folders will be injected here -->
                </div>
            </div>

            <div class="flex justify-center pt-4">
                <button 
                    onclick="downloadSelected()" 
                    id="downloadBtn"
                    class="bg-green-600 hover:bg-green-700 text-white px-12 py-4 rounded-2xl font-bold text-lg shadow-lg shadow-green-100 transition-all flex items-center gap-3"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    下載已選取的資料夾 (ZIP)
                </button>
            </div>
        </div>

        <!-- Progress Overlay (Hidden by default) -->
        <div id="progressModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50">
            <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center">
                <div class="loader mx-auto mb-4 w-12 h-12 border-4 border-blue-600 border-t-transparent"></div>
                <h3 class="text-xl font-bold mb-2" id="progressTitle">正在處理中</h3>
                <p class="text-slate-600 text-sm mb-4" id="progressDetail">請稍候，我們正在與 GitHub 通訊...</p>
                <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                    <div id="progressBar" class="bg-blue-600 h-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let repoData = {
            owner: '',
            name: '',
            branch: 'main',
            tree: []
        };

        const statusMsg = document.getElementById('statusMsg');
        const selectionArea = document.getElementById('selectionArea');
        const folderTree = document.getElementById('folderTree');
        const progressModal = document.getElementById('progressModal');
        const progressBar = document.getElementById('progressBar');
        const progressDetail = document.getElementById('progressDetail');

        async function fetchRepoStructure() {
            const url = document.getElementById('repoUrl').value.trim();
            if (!url) return showMessage("請輸入網址", "text-red-500");

            const match = url.match(/github\.com\/([^/]+)\/([^/]+)/);
            if (!match) return showMessage("無效的 GitHub 網址", "text-red-500");

            repoData.owner = match[1];
            repoData.name = match[2].replace('.git', '');
            
            showLoading(true, "正在獲取儲存庫資訊...");
            
            try {
                // 1. Get Default Branch
                const repoRes = await fetch(`https://api.github.com/repos/${repoData.owner}/${repoData.name}`);
                if (!repoRes.ok) throw new Error("找不到該儲存庫，請檢查是否為公開專案。");
                const repoJson = await repoRes.json();
                repoData.branch = repoJson.default_branch;

                // 2. Get Recursive Tree
                const treeRes = await fetch(`https://api.github.com/repos/${repoData.owner}/${repoData.name}/git/trees/${repoData.branch}?recursive=1`);
                if (!treeRes.ok) throw new Error("無法獲取檔案結構。");
                const treeJson = await treeRes.json();
                
                repoData.tree = treeJson.tree.filter(item => item.type === 'tree');
                renderTree();
                selectionArea.classList.remove('hidden');
                showMessage(`解析成功！找到 ${repoData.tree.length} 個資料夾。`, "text-green-600");
            } catch (err) {
                showMessage(err.message, "text-red-500");
                selectionArea.classList.add('hidden');
            } finally {
                showLoading(false);
            }
        }

        function renderTree() {
            folderTree.innerHTML = '';
            
            // Add root option
            const rootItem = document.createElement('div');
            rootItem.className = "flex items-center p-2 hover:bg-slate-50 rounded-lg group transition-colors";
            rootItem.innerHTML = `
                <input type="checkbox" id="root_check" value="/" class="w-5 h-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500 folder-checkbox">
                <label for="root_check" class="ml-3 flex-1 font-semibold text-slate-800 cursor-pointer">/ (整個專案根目錄)</label>
            `;
            folderTree.appendChild(rootItem);

            repoData.tree.forEach(item => {
                const depth = (item.path.match(/\//g) || []).length;
                const div = document.createElement('div');
                div.className = "flex items-center p-2 hover:bg-slate-50 rounded-lg group transition-colors";
                div.style.marginLeft = `${(depth + 1) * 20}px`;
                
                div.innerHTML = `
                    <input type="checkbox" id="${item.path}" value="${item.path}" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 folder-checkbox">
                    <label for="${item.path}" class="ml-3 flex-1 text-slate-700 cursor-pointer truncate">
                        <span class="text-slate-400 mr-2">📂</span>${item.path}
                    </label>
                `;
                folderTree.appendChild(div);
            });
            updateStats();
            
            // Add listeners to checkboxes
            document.querySelectorAll('.folder-checkbox').forEach(cb => {
                cb.addEventListener('change', updateStats);
            });
        }

        function toggleAll(checked) {
            document.querySelectorAll('.folder-checkbox').forEach(cb => cb.checked = checked);
            updateStats();
        }

        function updateStats() {
            const checked = document.querySelectorAll('.folder-checkbox:checked').length;
            document.getElementById('stats').innerText = `已選取: ${checked} 個資料夾`;
        }

        function showMessage(msg, colorClass) {
            statusMsg.innerText = msg;
            statusMsg.className = `mt-3 text-sm ${colorClass}`;
            statusMsg.classList.remove('hidden');
        }

        function showLoading(show, title = "處理中...", detail = "請稍候...") {
            if (show) {
                progressModal.classList.remove('hidden');
                document.getElementById('progressTitle').innerText = title;
                progressDetail.innerText = detail;
                progressBar.style.width = '0%';
            } else {
                progressModal.classList.add('hidden');
            }
        }

        async function downloadSelected() {
            const checkboxes = document.querySelectorAll('.folder-checkbox:checked');
            const paths = Array.from(checkboxes).map(cb => cb.value);

            if (paths.length === 0) {
                alert("請至少選取一個資料夾！");
                return;
            }

            const zip = new JSZip();
            showLoading(true, "正在準備檔案", "正在向 GitHub 請求檔案列表...");

            try {
                // Get all files in the repo (cached from previous step or re-fetch)
                const fullTreeRes = await fetch(`https://api.github.com/repos/${repoData.owner}/${repoData.name}/git/trees/${repoData.branch}?recursive=1`);
                const fullTreeData = await fullTreeRes.json();
                const allFiles = fullTreeData.tree.filter(item => item.type === 'blob');

                // Filter files that belong to selected folders
                let selectedFiles = [];
                if (paths.includes('/')) {
                    selectedFiles = allFiles;
                } else {
                    selectedFiles = allFiles.filter(file => 
                        paths.some(p => file.path === p || file.path.startsWith(p + '/'))
                    );
                }

                if (selectedFiles.length === 0) {
                    throw new Error("選取的資料夾內沒有檔案。");
                }

                const total = selectedFiles.length;
                let count = 0;

                // Download each file blob
                // We use parallel fetching with a limit to avoid API rate limits/browser crashes
                const CONCURRENCY = 5;
                for (let i = 0; i < selectedFiles.length; i += CONCURRENCY) {
                    const chunk = selectedFiles.slice(i, i + CONCURRENCY);
                    await Promise.all(chunk.map(async (file) => {
                        try {
                            const blobRes = await fetch(`https://raw.githubusercontent.com/${repoData.owner}/${repoData.name}/${repoData.branch}/${file.path}`);
                            if (!blobRes.ok) throw new Error();
                            const blob = await blobRes.blob();
                            zip.file(file.path, blob);
                        } catch (e) {
                            console.error("Failed to download:", file.path);
                        }
                        count++;
                        const percent = Math.floor((count / total) * 100);
                        progressBar.style.width = `${percent}%`;
                        progressDetail.innerText = `正在下載: ${count} / ${total} 檔案 (${file.path.split('/').pop()})`;
                    }));
                }

                progressDetail.innerText = "正在生成 ZIP 壓縮檔...";
                const content = await zip.generateAsync({ type: "blob" });
                
                // Trigger download
                const downloadUrl = window.URL.createObjectURL(content);
                const a = document.createElement("a");
                a.href = downloadUrl;
                a.download = `${repoData.name}-selected-folders.zip`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(downloadUrl);
                a.remove();

                showLoading(false);
            } catch (err) {
                alert("下載過程出錯: " + err.message);
                showLoading(false);
            }
        }
    </script>
</body>
</html>
